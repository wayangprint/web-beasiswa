name: Deploy GKS Korea Deck
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Merge deck with nav and guard
        run: |
          python3 << 'PYEOF'
          with open('deck-gks-korea.html', encoding='utf-8') as f: deck = f.read()
          with open('deck-nav-snippet.html', encoding='utf-8') as f: nav = f.read()
          with open('deck-guard-snippet-v4.html', encoding='utf-8') as f: guard = f.read()
          idx = deck.rfind('</body>')
          assert idx >= 0, 'no </body>'
          merged = deck[:idx] + nav + '\n' + guard + '\n' + deck[idx:]
          with open('decks/deck-gks-korea.html', 'w', encoding='utf-8') as f: f.write(merged)
          print('merged', len(merged))
          assert 'MASIH BUKA' in merged
          assert 'TUTUP' in merged
          assert '30 September 2026' in merged
          assert 'deck-guard-v4' in merged
          assert 'dnav-root' in merged
          print('verified')
          PYEOF
      - name: Commit
        run: |
          git config user.name wayangprint
          git config user.email wayangprint@users.noreply.github.com
          git add decks/deck-gks-korea.html
          git commit -m "Fix GKS Korea deadline: embassy track closed Sep 30 2026, university track still open"
          git push
