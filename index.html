<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1a1446" />
  <link rel="icon" href="data:," />
  <title>Web Beasiswa</title>
  <style>
    :root {
      color-scheme: light dark;
      --navy:#1a1446;
      --navy-2:#281f62;
      --purple:#7c3aed;
      --purple-2:#6d28d9;
      --blue:#2563eb;
      --ink:#17133a;
      --muted:#625e78;
      --bg:#f7f7fb;
      --surface:#ffffff;
      --surface-2:#f0eff8;
      --line:#dedcea;
      --green:#15803d;
      --green-bg:#dcfce7;
      --shadow:0 18px 48px rgba(26,20,70,.10);
      --shadow-sm:0 9px 24px rgba(26,20,70,.08);
      --radius:24px;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --ink:#f4f1ff;
        --muted:#b9b3ce;
        --bg:#100d26;
        --surface:#1b1738;
        --surface-2:#26204b;
        --line:#39315e;
        --green:#86efac;
        --green-bg:#153e2a;
        --shadow:0 18px 48px rgba(0,0,0,.24);
        --shadow-sm:0 9px 24px rgba(0,0,0,.18);
      }
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      min-width:320px;
      background:var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size:16px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    button, input { font:inherit; }
    button, a { -webkit-tap-highlight-color:transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline:3px solid color-mix(in srgb, var(--purple) 70%, white);
      outline-offset:3px;
    }
    #app { min-height:100dvh; }
    .page { width:min(1180px, calc(100% - 40px)); margin:0 auto; padding:34px 0 64px; }
    .page.narrow { width:min(820px, calc(100% - 40px)); }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
    .back {
      display:inline-flex; align-items:center; gap:8px; border:0; background:transparent;
      color:var(--purple); font-weight:800; padding:9px 0; text-decoration:none; cursor:pointer;
    }
    .mini-stat { color:var(--muted); font-size:.9rem; font-weight:650; }
    .hero {
      position:relative; overflow:hidden; min-height:360px; display:grid; align-items:end;
      border-radius:34px; padding:clamp(34px, 7vw, 74px);
      background:var(--navy); color:#fff; box-shadow:var(--shadow); isolation:isolate;
    }
    .hero::before {
      content:""; position:absolute; width:420px; height:420px; border-radius:50%; right:-120px; top:-190px;
      background:linear-gradient(145deg, rgba(124,58,237,.95), rgba(37,99,235,.74)); z-index:-1;
    }
    .hero::after {
      content:""; position:absolute; width:240px; height:240px; border-radius:50%; right:170px; bottom:-160px;
      border:42px solid rgba(255,255,255,.08); z-index:-1;
    }
    .hero-copy { max-width:760px; }
    .pill {
      display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:999px;
      font-weight:800; font-size:.83rem; line-height:1.2;
    }
    .pill.hero-pill { background:rgba(255,255,255,.13); color:#fff; border:1px solid rgba(255,255,255,.24); }
    .hero h1 { margin:22px 0 12px; font-size:clamp(2.55rem, 8vw, 5.7rem); line-height:.93; letter-spacing:-.065em; max-width:760px; }
    .hero p { margin:0; color:#dcd7fa; font-size:clamp(1.05rem, 2vw, 1.3rem); max-width:620px; }
    .section-heading { display:flex; align-items:end; justify-content:space-between; gap:24px; margin:48px 0 20px; }
    .section-heading h2, .page-title { margin:0; font-size:clamp(2rem, 5vw, 3.35rem); letter-spacing:-.045em; line-height:1.02; }
    .section-heading p { margin:0; max-width:440px; color:var(--muted); }
    .menu-grid { display:grid; grid-template-columns:repeat(12, 1fr); gap:18px; }
    .menu-card {
      grid-column:span 4; min-height:260px; display:flex; flex-direction:column; justify-content:space-between;
      background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius);
      padding:26px; text-decoration:none; box-shadow:var(--shadow-sm); transition:transform .18s ease, border-color .18s ease;
    }
    .menu-card:nth-child(1), .menu-card:nth-child(4) { grid-column:span 6; }
    .menu-card:hover { transform:translateY(-3px); border-color:color-mix(in srgb, var(--purple) 55%, var(--line)); }
    .iconbox { width:56px; height:56px; display:grid; place-items:center; border-radius:18px; color:#fff; background:var(--purple); }
    .iconbox svg { width:29px; height:29px; }
    .menu-card:nth-child(2) .iconbox, .menu-card:nth-child(5) .iconbox { background:var(--navy); }
    .menu-card:nth-child(3) .iconbox { background:var(--blue); }
    .menu-card h3 { margin:28px 0 7px; font-size:1.38rem; line-height:1.12; }
    .menu-card p { margin:0; color:var(--muted); }
    .card-action { display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--purple); font-weight:850; margin-top:24px; }
    .card-action span:last-child { font-size:1.35rem; }
    footer { padding:34px 0 10px; color:var(--muted); font-size:.9rem; text-align:center; }
    .index-head { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:28px; }
    .index-head p { color:var(--muted); margin:12px 0 0; }
    .count-pill { background:var(--surface-2); color:var(--purple); white-space:nowrap; }
    .tools {
      position:sticky; top:12px; z-index:4; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px;
      background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); padding:12px;
      margin:0 -12px 24px; border-radius:20px;
    }
    .search { position:relative; }
    .search svg { position:absolute; left:16px; top:50%; transform:translateY(-50%); width:20px; color:var(--muted); }
    .search input {
      width:100%; height:50px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
      border-radius:16px; padding:0 16px 0 46px; box-shadow:var(--shadow-sm);
    }
    .filters { display:flex; gap:7px; }
    .chip {
      border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px;
      padding:0 15px; height:50px; font-weight:800; cursor:pointer;
    }
    .chip[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
    .results-line { color:var(--muted); font-size:.93rem; margin:0 0 16px; }
    .program-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; }
    .program-card {
      display:flex; flex-direction:column; min-height:238px; background:var(--surface); border:1px solid var(--line);
      border-radius:22px; padding:21px; box-shadow:var(--shadow-sm); cursor:pointer; transition:border-color .18s ease, transform .18s ease;
    }
    .program-card:hover { transform:translateY(-2px); border-color:var(--purple); }
    .program-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .status { font-size:.76rem; padding:6px 10px; border-radius:999px; font-weight:900; letter-spacing:.01em; }
    .status.full { background:#ede9fe; color:#5b21b6; }
    .status.partial { background:#e7eef8; color:#334e73; }
    @media (prefers-color-scheme:dark) {
      .status.full { background:#3a2470; color:#d8c7ff; }
      .status.partial { background:#27364a; color:#bdd1ee; }
    }
    .country { color:var(--muted); font-size:.82rem; font-weight:700; text-align:right; }
    .program-card h3 { margin:18px 0 8px; font-size:1.08rem; line-height:1.3; }
    .deck-name { color:var(--muted); font-size:.88rem; margin:0; }
    .program-link { margin-top:auto; padding-top:20px; display:flex; align-items:center; justify-content:space-between; color:var(--purple); font-weight:850; }
    .empty { padding:70px 20px; text-align:center; border:1px dashed var(--line); border-radius:22px; color:var(--muted); grid-column:1/-1; }
    .pay-hero {
      background:var(--navy); color:#fff; border-radius:28px; padding:clamp(28px,5vw,48px); margin-bottom:18px; position:relative; overflow:hidden;
    }
    .pay-hero::after { content:""; position:absolute; width:180px; height:180px; border-radius:50%; background:var(--purple); right:-70px; top:-80px; opacity:.65; }
    .pay-hero h1 { position:relative; z-index:1; margin:16px 0 10px; font-size:clamp(1.8rem,5vw,3rem); letter-spacing:-.04em; line-height:1.05; max-width:650px; }
    .pay-hero p { position:relative; z-index:1; margin:0; color:#dcd7fa; }
    .checkout-layout { display:grid; grid-template-columns:.85fr 1.15fr; gap:18px; align-items:start; }
    .price-card, .payment-card { background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:26px; box-shadow:var(--shadow-sm); }
    .price-label { color:var(--muted); font-size:.88rem; font-weight:700; }
    .price { margin:5px 0 4px; font-size:2.55rem; letter-spacing:-.05em; font-weight:900; line-height:1; }
    .once { color:var(--muted); margin:0; }
    .benefits { margin:28px 0 0; padding:0; list-style:none; display:grid; gap:14px; }
    .benefits li { display:flex; align-items:flex-start; gap:10px; }
    .tick { width:22px; height:22px; flex:0 0 22px; display:grid; place-items:center; border-radius:50%; background:#ede9fe; color:#5b21b6; font-weight:900; font-size:.78rem; }
    .tabs { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; background:var(--surface-2); border-radius:15px; padding:5px; }
    .tab { border:0; background:transparent; color:var(--muted); padding:11px 8px; border-radius:11px; font-weight:850; cursor:pointer; }
    .tab[aria-selected="true"] { background:var(--surface); color:var(--purple); box-shadow:var(--shadow-sm); }
    .method-panel { padding:24px 0 0; min-height:242px; }
    .method-panel h2 { margin:0 0 8px; font-size:1.3rem; }
    .method-panel > p { margin:0; color:var(--muted); }
    .qris-placeholder, .va-placeholder {
      margin-top:18px; min-height:122px; border:2px dashed var(--line); border-radius:18px; display:grid; place-items:center;
      text-align:center; padding:22px; color:var(--muted); background:var(--surface-2);
    }
    .qris-placeholder { width:190px; min-height:190px; margin-inline:auto; }
    .amount-row { display:flex; justify-content:space-between; gap:16px; padding:15px 0; border-bottom:1px solid var(--line); margin-bottom:18px; }
    .amount-row strong { font-size:1.12rem; }
    .bank-list { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
    .bank-pill { position:relative; }
    .bank-pill input { position:absolute; opacity:0; pointer-events:none; }
    .bank-pill span { display:block; border:1px solid var(--line); border-radius:999px; padding:9px 14px; font-weight:800; color:var(--muted); cursor:pointer; }
    .bank-pill input:checked + span { background:var(--navy); color:#fff; border-color:var(--navy); }
    .pay-btn {
      width:100%; border:0; background:var(--purple); color:#fff; border-radius:15px; min-height:54px;
      padding:12px 20px; font-weight:900; cursor:pointer; box-shadow:0 12px 24px rgba(124,58,237,.24);
    }
    .pay-btn:hover { background:var(--purple-2); }
    .demo-note { margin:13px 0 0; color:var(--muted); font-size:.85rem; text-align:center; }
    .placeholder { min-height:70dvh; display:grid; place-items:center; text-align:center; }
    .placeholder-box { max-width:640px; }
    .placeholder-icon { width:84px; height:84px; display:grid; place-items:center; margin:0 auto 25px; border-radius:27px; background:var(--surface-2); color:var(--purple); }
    .placeholder-icon svg { width:42px; height:42px; }
    .placeholder h1 { margin:0 0 14px; font-size:clamp(2.4rem,7vw,4.8rem); letter-spacing:-.06em; line-height:.95; }
    .placeholder p { color:var(--muted); font-size:1.07rem; }
    .primary-link { display:inline-flex; align-items:center; justify-content:center; margin-top:24px; padding:13px 20px; border-radius:14px; background:var(--navy); color:#fff; text-decoration:none; font-weight:850; }
    .success-mark { width:112px; height:112px; display:grid; place-items:center; margin:0 auto 28px; border-radius:50%; background:var(--green-bg); color:var(--green); font-size:4.1rem; font-weight:900; }
    .demo-banner { display:inline-block; margin-top:14px; background:var(--surface-2); color:var(--muted); border-radius:999px; padding:7px 12px; font-size:.82rem; font-weight:750; }
    .modal-backdrop { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:22px; background:rgba(10,7,34,.66); }
    .modal { width:min(440px,100%); background:var(--surface); color:var(--ink); border-radius:24px; padding:30px; box-shadow:0 30px 100px rgba(0,0,0,.35); text-align:center; }
    .modal .success-mark { width:72px; height:72px; font-size:2.7rem; margin-bottom:18px; }
    .modal h2 { margin:0 0 8px; }
    .modal p { margin:0; color:var(--muted); }
    .modal small { display:block; margin-top:18px; color:var(--muted); }

    .account-bar { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:18px; min-height:42px; }
    .account-name { color:var(--muted); font-size:.9rem; font-weight:800; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .account-link, .account-button {
      display:inline-flex; align-items:center; justify-content:center; min-height:42px; border:1px solid var(--line);
      background:var(--surface); color:var(--ink); border-radius:13px; padding:8px 14px; text-decoration:none; font-weight:850; cursor:pointer;
    }
    .account-button { color:var(--purple); }
    .topline .account-bar { margin:0 0 0 auto; min-height:auto; }
    .auth-shell { display:grid; grid-template-columns:.8fr 1.2fr; gap:18px; align-items:stretch; }
    .auth-intro { background:var(--navy); color:#fff; border-radius:28px; padding:34px; display:flex; flex-direction:column; justify-content:space-between; min-height:500px; overflow:hidden; position:relative; }
    .auth-intro::after { content:""; position:absolute; width:230px; height:230px; border-radius:50%; background:var(--purple); right:-95px; bottom:-95px; opacity:.75; }
    .auth-intro h1 { position:relative; z-index:1; margin:20px 0 12px; font-size:clamp(2.3rem,4.3vw,3.55rem); line-height:.98; letter-spacing:-.055em; overflow-wrap:anywhere; }
    .auth-intro p { position:relative; z-index:1; margin:0; color:#dcd7fa; }
    .auth-steps { position:relative; z-index:1; margin:32px 0 0; padding:0; list-style:none; display:grid; gap:13px; }
    .auth-steps li { display:flex; align-items:center; gap:11px; color:#eeeaff; font-weight:700; }
    .step-number { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.13); font-size:.82rem; }
    .auth-card { background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:clamp(24px,5vw,40px); box-shadow:var(--shadow-sm); }
    .auth-tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--surface-2); border-radius:15px; padding:5px; margin-bottom:28px; }
    .auth-tab { border:0; background:transparent; color:var(--muted); padding:11px; border-radius:11px; font-weight:900; cursor:pointer; }
    .auth-tab[aria-selected="true"] { background:var(--surface); color:var(--purple); box-shadow:var(--shadow-sm); }
    .auth-card h2 { margin:0 0 6px; font-size:1.65rem; letter-spacing:-.025em; }
    .auth-card > p { margin:0 0 22px; color:var(--muted); }
    .form-grid { display:grid; gap:16px; }
    .field { display:grid; gap:7px; }
    .field span { font-size:.88rem; font-weight:850; }
    .field input {
      width:100%; height:52px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); padding:0 15px;
    }
    .field input[type="file"] { height:auto; min-height:52px; padding:12px; }
    .form-help { color:var(--muted); font-size:.84rem; margin:-6px 0 0; }
    .notice { border-radius:15px; padding:13px 15px; margin:0 0 18px; font-weight:750; }
    .notice.info { background:var(--surface-2); color:var(--muted); }
    .notice.error { background:#fee2e2; color:#991b1b; }
    .notice.success { background:var(--green-bg); color:var(--green); }
    @media (prefers-color-scheme:dark) { .notice.error { background:#4a2026; color:#fecaca; } }
    .notice[hidden] { display:none; }
    .member-unavailable { margin:0 0 18px; border:1px solid var(--line); }
    .payment-stack { display:grid; gap:18px; }
    .bank-accounts { display:grid; gap:10px; margin-top:18px; }
    .bank-account { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; border:1px solid var(--line); border-radius:15px; padding:14px; }
    .bank-account strong, .bank-account span { display:block; }
    .bank-account span { color:var(--muted); font-size:.86rem; }
    .copy-btn { border:1px solid var(--line); background:var(--surface-2); color:var(--purple); border-radius:11px; padding:9px 11px; font-weight:850; cursor:pointer; }
    .qris-image { width:min(340px,100%); height:auto; object-fit:contain; display:block; margin:18px auto 0; border-radius:16px; background:#fff; padding:8px; box-shadow:0 8px 24px rgba(26,20,70,.08); }
    .qris-merchant { margin:12px 0 0; text-align:center; color:var(--ink); font-weight:900; }
    .proof-card { margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:26px; box-shadow:var(--shadow-sm); }
    .proof-card h2 { margin:0 0 7px; font-size:1.35rem; }
    .proof-card > p { margin:0 0 20px; color:var(--muted); }
    .status-card { margin-top:18px; background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:26px; box-shadow:var(--shadow-sm); text-align:center; }
    .verification-badge { display:inline-flex; align-items:center; justify-content:center; min-height:34px; border-radius:999px; padding:7px 13px; font-size:.84rem; font-weight:900; }
    .verification-badge.waiting { background:#fef3c7; color:#92400e; }
    .verification-badge.verified { background:var(--green-bg); color:var(--green); }
    .continue-btn { display:flex; width:100%; align-items:center; justify-content:center; min-height:58px; margin-top:18px; border:0; border-radius:15px; background:var(--purple); color:#fff; font-weight:950; cursor:pointer; }
    .continue-btn:disabled, .pay-btn:disabled { background:var(--surface-2); color:var(--muted); box-shadow:none; cursor:not-allowed; border:1px solid var(--line); }
    .continue-help { margin:10px 0 0; color:var(--muted); font-size:.86rem; }
    .deck-button { margin-top:auto; display:flex; width:100%; align-items:center; justify-content:center; min-height:44px; border:0; border-radius:13px; background:var(--purple); color:#fff; font-weight:900; cursor:pointer; }
    .deck-button:disabled { background:var(--surface-2); color:var(--muted); border:1px solid var(--line); cursor:not-allowed; }
    .program-card:has(.deck-button:not(:disabled)) { cursor:default; }
    .upload-status { margin:12px 0 0; color:var(--muted); font-size:.88rem; font-weight:750; }
    .upload-status.error { color:#b91c1c; }
    .upload-status.success { color:var(--green); }
    .hidden { display:none !important; }

    @media (max-width:900px) {
      .menu-card, .menu-card:nth-child(1), .menu-card:nth-child(4) { grid-column:span 6; }
      .menu-card:last-child { grid-column:1/-1; }
      .program-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .checkout-layout, .auth-shell { grid-template-columns:1fr; }
      .auth-intro { min-height:340px; }
    }
    @media (max-width:640px) {
      .page, .page.narrow { width:min(100% - 24px, 1180px); padding-top:18px; }
      .hero { min-height:410px; border-radius:26px; padding:28px 24px; }
      .hero h1 { font-size:3.25rem; }
      .section-heading, .index-head { align-items:flex-start; flex-direction:column; }
      .section-heading { margin-top:36px; }
      .menu-grid { display:block; }
      .menu-card { min-height:230px; margin-bottom:12px; border-radius:20px; }
      .tools { grid-template-columns:1fr; top:0; margin-inline:-6px; padding:8px 6px 12px; border-radius:0 0 18px 18px; }
      .filters { display:grid; grid-template-columns:repeat(3,1fr); }
      .chip { height:44px; padding:0 10px; }
      .program-grid { grid-template-columns:1fr; }
      .program-card { min-height:210px; }
      .pay-hero, .price-card, .payment-card { border-radius:20px; padding:22px; }
      .tabs { grid-template-columns:1fr; }
      .tab { text-align:left; padding-inline:14px; }
      .qris-placeholder { width:170px; min-height:170px; }
      .topline { margin-bottom:18px; flex-wrap:wrap; }
      .topline .account-bar { width:100%; justify-content:flex-end; }
      .auth-intro, .auth-card { border-radius:20px; }
      .auth-intro { min-height:310px; padding:24px; }
      .bank-account { grid-template-columns:1fr; }
      .copy-btn { width:100%; }
      .proof-card, .status-card { border-radius:20px; padding:22px; }
      .mini-stat { display:none; }
    }
    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      *, *::before, *::after { animation:none !important; transition:none !important; }
    }
  </style>

      .payment-card {

      .tab,
      .pay-btn {

    function getDeviceId() {
      if (cachedDeviceId) return cachedDeviceId;

      if (!cachedDeviceId) {

    function getDeviceLabel() {
      const agent=navigator.userAgent || '';
      let browser='Browser';
      if (/Edg\//.test(agent)) browser='Edge';
      else if (/OPR\//.test(agent)) browser='Opera';
      else if (/CriOS\//.test(agent)) browser='Chrome';
      else if (/Chrome\//.test(agent)) browser='Chrome';
      else if (/FxiOS\//.test(agent)) browser='Firefox';
      else if (/Firefox\//.test(agent)) browser='Firefox';
      else if (/Safari\//.test(agent)) browser='Safari';
      let platform='Perangkat';
      if (/Android/.test(agent)) platform='Android';
      else if (/iPhone|iPad|iPod/.test(agent)) platform='iOS';
      else if (/Windows/.test(agent)) platform='Windows';
      else if (/Macintosh|Mac OS X/.test(agent)) platform='macOS';
      else if (/Linux/.test(agent)) platform='Linux';
      return `${browser} · ${platform}`;
    }

    async function registerDevice() {
      if (!sb || !currentSession || !currentUser) return true;
      try {
        const deviceId=getDeviceId();
        const now=new Date().toISOString();
        const {error:upsertError}=await sb.from('devices').upsert({
          user_id:currentUser.id,
          device_id:deviceId,
          device_label:getDeviceLabel(),
          last_seen:now
        },{onConflict:'user_id,device_id'});
        if (upsertError) return true;
        const {data,error}=await sb.from('devices').select('device_id,last_seen').eq('user_id',currentUser.id).order('last_seen',{ascending:true});
        if (error || !Array.isArray(data) || data.length<=MAX_DEVICES) return true;
        const oldest=data.filter(device=>device.device_id!==deviceId).slice(0,data.length-MAX_DEVICES);
        for (const device of oldest) {
          const {error:deleteError}=await sb.from('devices').delete().eq('user_id',currentUser.id).eq('device_id',device.device_id);
          if (deleteError) return true;
        }
      } catch (error) {}
      return true;
    }
    async function checkDeviceValid() {
      if (!sb || !currentSession || !currentUser) return true;
      if (deviceCheckInFlight) return deviceCheckInFlight;
      deviceCheckInFlight=(async()=>{
        try {
          const deviceId=getDeviceId();
          const {data,error}=await sb.from('devices').select('device_id').eq('user_id',currentUser.id).eq('device_id',deviceId).maybeSingle();
          if (error) return true;
          if (!data) {
            clearDeviceValidation();
            try { await sb.auth.signOut(); } catch (error) {}
            currentSession=null;
            currentUser=null;
            currentProfile=null;
            latestVerification=null;
            pendingAuthNotice='Sesi di perangkat ini telah berakhir karena akun dipakai di lebih dari 5 perangkat.';
            navigate('/auth');
            return false;
          }
          const {error:updateError}=await sb.from('devices').update({last_seen:new Date().toISOString()}).eq('user_id',currentUser.id).eq('device_id',deviceId);
          if (updateError) return true;
        } catch (error) {}
        return true;
      })();
      try { return await deviceCheckInFlight; }
      finally { deviceCheckInFlight=null; }
    }

    async function handleAuthSubmit(event, notice, submit) {
      event.preventDefault();
      if (!sb) { showNotice(notice,'info',memberUnavailableMessage()); return; }
      const form = event.currentTarget;
      const values = Object.fromEntries(new FormData(form));
      const email = String(values.email || '').trim();
      const password = String(values.password || '');
      const username = String(values.username || '').trim();
      if (!email || !password || (activeAuthMode==='signup' && !username)) { showNotice(notice,'error','Semua kolom wajib diisi.'); return; }
      if (activeAuthMode==='signup' && password.length < 6) { showNotice(notice,'error','Password minimal 6 karakter.'); return; }
      submit.disabled=true; submit.textContent=activeAuthMode==='signup'?'Mendaftarkan…':'Memproses…'; authActionBusy=true;
      try {
        if (activeAuthMode==='signup') {
          const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ username } } });
          if (error) throw error;
          if (!data.session) {
            showNotice(notice,'success','Pendaftaran berhasil! Cek email kamu untuk verifikasi, lalu masuk.'); form.reset(); return;
          }
          currentSession=data.session; currentUser=data.user; await registerDevice(); startDeviceValidation(); await fetchProfile(); await routeAfterAuth();
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentSession=data.session; currentUser=data.user; await registerDevice(); startDeviceValidation(); await fetchProfile(); await routeAfterAuth();
        }
      } catch (error) {
        showNotice(notice,'error',translateAuthError(error.message));
      } finally {
        authActionBusy=false;
        if (document.body.contains(submit)) { submit.disabled=!supabaseReady; submit.textContent=activeAuthMode==='signup'?'Daftar':'Masuk'; }
      }
    }

      });

      panel.innerHTML='';
      if (method==='qris') {
        panel.append(element('h2','', 'Bayar dengan QRIS'),element('p','', 'Pindai QRIS dari aplikasi bank atau dompet digital.'));
        if (PAYMENT_CONFIG.qrisImage) { const image=document.createElement('img'); image.className='qris-image'; image.src=PAYMENT_CONFIG.qrisImage; image.alt=`Kode QRIS ${PAYMENT_CONFIG.qrisMerchantName} untuk pembayaran akses member`; panel.append(image,element('p','qris-merchant',PAYMENT_CONFIG.qrisMerchantName)); }
        else panel.append(element('div','qris-placeholder','QRIS segera dipasang'));
      } else if (method==='bank') {
        panel.append(element('h2','', 'Transfer Bank'),element('p','', 'Transfer sesuai nominal ke rekening berikut.'));
        const list=element('div','bank-accounts');
        PAYMENT_CONFIG.bankAccounts.forEach(account=>{
          const item=element('div','bank-account'); const detail=element('div'); detail.append(element('strong','',`${account.bank} · ${account.number}`),element('span','',`a.n. ${account.name}`));
          const copy=element('button','copy-btn','Salin Nomor'); copy.type='button'; copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(account.number); copy.textContent='Tersalin ✓'; window.setTimeout(()=>copy.textContent='Salin Nomor',1500);}catch(error){copy.textContent='Gagal menyalin';}}); item.append(detail,copy); list.append(item);
        }); panel.append(list);
      }
      const amount=element('div','amount-row'); amount.append(element('span','', 'Total'),element('strong','',formatIdr(PAYMENT_CONFIG.product.priceIdr))); panel.append(amount);
    }

    function paywallView(unavailable=false) {
      app.innerHTML='';
      const page=element('div','page narrow'); page.append(topLine(pendingProgramSlug?'← Kembali ke Indeks':'← Kembali ke Halaman Utama',pendingProgramSlug?'#/s1/':'#/'));
      const hero=element('header','pay-hero'); hero.append(element('span','pill hero-pill','Verifikasi Manual'),element('h1','', 'Aktifkan akses semua deck'),element('p','', 'Sekali bayar, akses semua deck selamanya.')); page.append(hero);
      if (unavailable) page.append(element('div','notice info member-unavailable',memberUnavailableMessage()));
      const layout=element('div','checkout-layout');
      const price=element('aside','price-card'); price.innerHTML=`<div class="price-label">Sekali bayar</div><div class="price">${formatIdr(PAYMENT_CONFIG.product.priceIdr)}</div><p class="once">Akses semua deck beasiswa.</p><ul class="benefits"><li><span class="tick">✓</span><span>44 deck S1 lengkap</span></li><li><span class="tick">✓</span><span>Satu verifikasi untuk seluruh halaman</span></li><li><span class="tick">✓</span><span>Akses selamanya</span></li></ul>`;
      const payment=element('section','payment-card'); const tabs=element('div','tabs'); tabs.setAttribute('role','tablist'); tabs.setAttribute('aria-label','Metode pembayaran');
      const panel=element('div','method-panel'); let method='qris';
      [['qris','QRIS'],['bank','Transfer Bank']].forEach(([id,label],index)=>{const tab=element('button','tab',label); tab.type='button'; tab.dataset.method=id; tab.setAttribute('role','tab'); tab.setAttribute('aria-selected',String(index===0)); tab.addEventListener('click',()=>{method=id; tabs.querySelectorAll('.tab').forEach(item=>item.setAttribute('aria-selected',String(item.dataset.method===id))); renderPaymentMethod(panel,method);}); tabs.append(tab);});
      payment.append(tabs,panel); layout.append(price,payment); page.append(layout); renderPaymentMethod(panel,method);

      const proof=element('section','proof-card'); proof.append(element('h2','', 'Kirim Bukti Pembayaran'),element('p','', 'Unggah screenshot atau foto bukti pembayaran. Maksimal 5 MB.'));
      if (!currentUser && !unavailable) proof.append(element('div','notice info','Daftar atau masuk sebagai member sebelum mengirim bukti pembayaran.'));
      const form=element('form','form-grid'); const fileField=buildField('File bukti pembayaran','file','proof','Pilih gambar'); fileField.input.accept='image/*'; fileField.input.disabled=unavailable || !currentUser;
      const upload=element('button','pay-btn','Kirim Bukti'); upload.type='submit'; upload.disabled=unavailable || !currentUser; const uploadStatus=element('p','upload-status',''); uploadStatus.setAttribute('role','status'); form.append(fileField.label,upload,uploadStatus); form.addEventListener('submit',event=>uploadProof(event,fileField.input,upload,uploadStatus)); proof.append(form); page.append(proof);

      const statusCard=element('section','status-card'); statusCard.append(element('h2','', 'Status Akses'));
      const badge=element('span','verification-badge waiting','Menunggu verifikasi admin'); const continueButton=element('button','continue-btn','Lanjutkan'); continueButton.type='button';
      continueButton.addEventListener('click',()=>{
        if (!currentUser) {
          pendingRoute='/paywall';
          navigate(pendingProgramSlug?`/auth?program=${encodeURIComponent(pendingProgramSlug)}`:'/auth');
        } else if (pendingProgramSlug && currentProfile?.verified===true) openDeckForSlug(pendingProgramSlug);
        else navigate('/s1/');
      });
      const help=element('p','continue-help','Tombol aktif setelah admin memverifikasi pembayaranmu.'); statusCard.append(badge,continueButton,help); page.append(statusCard,footerNode()); app.append(page);
      updatePaywallStatus(badge,continueButton,help,unavailable);
      if (!unavailable && currentUser && currentProfile?.verified !== true) startPaywallPolling();
    }

    function updatePaywallStatus(badge,button,help,unavailable=false) {
      if (!unavailable && !currentUser) {
        badge.className='verification-badge waiting'; badge.textContent='Belum masuk';
        button.disabled=false; button.textContent='Daftar / Masuk'; help.textContent='Buat akun member atau masuk untuk mengirim bukti pembayaran.';
        return;
      }
      const verified=!unavailable && currentProfile?.verified===true;
      badge.className=`verification-badge ${verified?'verified':'waiting'}`; badge.textContent=verified?'Terverifikasi ✓':'Menunggu verifikasi admin';
      button.disabled=!verified; button.textContent='Lanjutkan'; help.textContent=verified?'Pembayaranmu sudah diverifikasi. Kamu bisa membuka seluruh halaman.':'Tombol aktif setelah admin memverifikasi pembayaranmu.';
    }

    async function uploadProof(event,input,button,statusNode) {
      event.preventDefault();
      if (!sb || !currentUser) { statusNode.className='upload-status error'; statusNode.textContent=memberUnavailableMessage(); return; }
      const file=input.files?.[0];
      if (!file) { statusNode.className='upload-status error'; statusNode.textContent='Pilih file gambar bukti pembayaran terlebih dahulu.'; return; }
      if (!file.type.startsWith('image/')) { statusNode.className='upload-status error'; statusNode.textContent='File harus berupa gambar.'; return; }
      if (file.size > 5 * 1024 * 1024) { statusNode.className='upload-status error'; statusNode.textContent='Ukuran gambar maksimal 5 MB.'; return; }
      const mimeExt=(file.type.split('/')[1] || 'jpg').replace('jpeg','jpg').replace(/[^a-z0-9]/gi,''); const path=`${currentUser.id}/${Date.now()}.${mimeExt}`;
      button.disabled=true; button.textContent='Mengirim…'; statusNode.className='upload-status'; statusNode.textContent='Bukti pembayaran sedang dikirim.';
      try {
        const { data, error:uploadError }=await sb.storage.from('bukti-pembayaran').upload(path,file,{cacheControl:'3600',upsert:false});
        if (uploadError) throw uploadError;
        const { error:insertError }=await sb.from('verifikasi').insert({user_id:currentUser.id,proof_url:data.path,status:'menunggu'});
        if (insertError) throw insertError;
        latestVerification={status:'menunggu',created_at:new Date().toISOString()}; input.value=''; statusNode.className='upload-status success'; statusNode.textContent='Bukti berhasil dikirim. Admin akan memverifikasinya.';
      } catch (error) {
        statusNode.className='upload-status error'; statusNode.textContent=`Gagal mengirim bukti: ${error.message}`;
      } finally { button.disabled=false; button.textContent='Kirim Bukti'; }
    }

    function startPaywallPolling() {
      clearPaywallPolling(); paywallTimer=window.setInterval(refreshPaywallStatus,20000);
    }
    async function refreshPaywallStatus() {
      const {path}=parseRoute(); if (path!=='/paywall' || !sb || !currentUser || currentProfile?.verified===true) return;
      await Promise.all([fetchProfile(),fetchLatestVerification()]);
      const badge=document.querySelector('.verification-badge'); const button=document.querySelector('.continue-btn'); const help=document.querySelector('.continue-help');
      if (badge && button && help) updatePaywallStatus(badge,button,help,false);
      if (currentProfile?.verified===true) clearPaywallPolling();
    }

    const PLACEHOLDERS={
      '/s2/':{title:'Beasiswa S2',desc:'Panduan beasiswa magister luar negeri sedang disiapkan. Bagian ini akan membahas strategi LoA, esai, dan pemilihan kampus.'},
      '/s3/':{title:'Beasiswa S3',desc:'Panduan beasiswa doktoral luar negeri sedang disiapkan. Bagian ini akan membahas calon promotor, proposal riset, dan jalur pendanaan.'},
      '/persiapan-bahasa/':{title:'Persiapan Bahasa',desc:'Panduan target skor IELTS dan TOEFL per beasiswa sedang disiapkan. Akan ada rencana belajar dan tips latihan yang terstruktur.'},
      '/pra-beasiswa/':{title:'Pra Beasiswa',desc:'Roadmap persiapan 12 bulan sedang disiapkan. Bagian ini akan merinci timeline, dokumen, dan strategi rekomendasi.'}
    };
    function normalizePath(path) { if (path==='/' || path.endsWith('/')) return path; return `${path}/`; }
    function placeholderView(data) {
      app.innerHTML=''; const page=element('div','page narrow'); page.append(topLine('← Kembali','#/'));
      const holder=element('div','placeholder'); const box=element('section','placeholder-box'); box.append(iconNode('clock','placeholder-icon'),element('span','pill count-pill',data.title),element('h1','', 'Segera Hadir'),element('p','',data.desc)); const back=element('a','primary-link','← Kembali'); back.href='#/'; box.append(back); holder.append(box); page.append(holder,footerNode()); app.append(page);
    }
    function successView() {
      app.innerHTML=''; const page=element('div','page narrow'); const holder=element('div','placeholder'); const box=element('section','placeholder-box');
      box.append(element('div','success-mark','✓'),element('h1','', 'Akses kamu sudah aktif!'),element('p','', 'Kamu sekarang bisa membuka seluruh deck beasiswa.')); const link=element('a','primary-link','Buka Indeks S1'); link.href='#/s1/'; box.append(link); holder.append(box); page.append(holder,footerNode()); app.append(page);
    }

    async function renderRoute() {
      clearPaywallPolling(); const {path,params}=parseRoute(); const normalized=normalizePath(path); window.scrollTo(0,0);
      const routeProgram=params.get('program');
      if (routeProgram && Object.prototype.hasOwnProperty.call(DECK_URLS,routeProgram)) pendingProgramSlug=routeProgram;
      if (path==='/' || path==='') { pendingProgramSlug=''; homeView(); return; }
      if (normalized==='/s1/') {
        pendingProgramSlug='';
        if (sb && currentUser) await fetchProfile();
        indexView(); return;
      }
      if (path==='/auth' || path==='/auth/') { authView(); return; }
      if (path==='/paywall' || path==='/paywall/') {
        if (!supabaseReady) { paywallView(true); return; }
        if (!currentUser) { paywallView(false); return; }
        await Promise.all([fetchProfile(),fetchLatestVerification()]);
        if (currentProfile?.verified) {
          if (pendingProgramSlug) openDeckForSlug(pendingProgramSlug);
          else navigate('/s1/');
          return;
        }
        paywallView(false); return;
      }
      const protectedRoutes=new Set(['/s2/','/s3/','/persiapan-bahasa/','/pra-beasiswa/','/sukses/']);
      if (protectedRoutes.has(normalized)) {
        pendingRoute=normalized;
        if (!supabaseReady || !currentUser) { navigate('/auth'); return; }
        await fetchProfile();
        if (!currentProfile?.verified) { navigate('/paywall'); return; }
        if (normalized==='/sukses/') successView();
        else placeholderView(PLACEHOLDERS[normalized]);
        return;
      }
      homeView();
    }

    let lifecycleListenersBound=false;

    function bindLifecycleListeners() {
      if (lifecycleListenersBound) return;
      lifecycleListenersBound=true;
      window.addEventListener('hashchange',renderRoute);
      window.addEventListener('pageshow',event=>{
        if (event.persisted || !app.firstElementChild) void renderRoute();
        checkDeviceValidThrottled();
      });
      window.addEventListener('focus',()=>{
        checkDeviceValidThrottled();
        const {path}=parseRoute();
        if(path==='/paywall') refreshPaywallStatus();
      });
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState!=='visible') return;
        if (!app.firstElementChild) void renderRoute();
        checkDeviceValidThrottled();
        const {path}=parseRoute();
        if(path==='/paywall') refreshPaywallStatus();
      });
    }

    async function initializeCurrentDevice() {
      if (!sb || !currentSession || !currentUser) return;
      await registerDevice();
      const deviceValid=await checkDeviceValid();
      if (deviceValid) startDeviceValidation();
    }

    async function initApp() {
      bindLifecycleListeners();
      if (sb) {
        try {
          const {data,error}=await sb.auth.getSession();
          if (error) throw error;
          currentSession=data.session || null;
          currentUser=data.session?.user || null;
        } catch (error) {
          supabaseConnectionError=error;
          currentSession=null;
          currentUser=null;
          clearDeviceValidation();
        }
        sb.auth.onAuthStateChange((_event,session)=>{
          currentSession=session;
          currentUser=session?.user || null;
          if (!currentUser) {
            currentProfile=null;
            clearDeviceValidation();
          }
          if (!authActionBusy) window.setTimeout(renderRoute,0);
        });
      }

      // Paint the requested page before device-table network checks. Those checks
      // can be slow after returning from a deck and must never leave #app empty.
      await renderRoute();
      if (currentSession && currentUser) void initializeCurrentDevice();
    }

    function xhrFetch(input, init={}) {
      return new Promise((resolve, reject) => {
        const request = input instanceof Request ? input : null;
        const url = request ? request.url : String(input);
        const method = init.method || request?.method || 'GET';
        const xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.withCredentials = init.credentials === 'include';

        const headers = new Headers(request?.headers || undefined);
        new Headers(init.headers || undefined).forEach((value, key) => headers.set(key, value));
        headers.forEach((value, key) => xhr.setRequestHeader(key, value));

        const abort = () => {
          xhr.abort();
          reject(new DOMException('Permintaan dibatalkan.', 'AbortError'));
        };
        if (init.signal?.aborted) { abort(); return; }
        init.signal?.addEventListener('abort', abort, { once:true });

        xhr.onload = () => {
          init.signal?.removeEventListener('abort', abort);
          const responseHeaders = new Headers();
          xhr.getAllResponseHeaders().trim().split(/[\r\n]+/).forEach(line => {
            const separator = line.indexOf(':');
            if (separator > 0) responseHeaders.append(line.slice(0, separator).trim(), line.slice(separator + 1).trim());
          });
          resolve(new Response(xhr.responseText, {
            status: xhr.status,
            statusText: xhr.statusText,
            headers: responseHeaders
          }));
        };
        xhr.onerror = () => {
          init.signal?.removeEventListener('abort', abort);
          reject(new TypeError('Koneksi ke Supabase terputus sebelum server merespons.'));
        };
        xhr.ontimeout = () => reject(new TypeError('Koneksi ke Supabase melewati batas waktu.'));
        xhr.send(init.body ?? request?.body ?? null);
      });
    }

    async function bootstrapApp() {
      try {
        await window.__supabaseSdkPromise;
        if (window.__supabaseSdkError) throw window.__supabaseSdkError;
        if (!isSupabaseConfigured()) throw new Error('Konfigurasi Supabase belum lengkap.');
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          throw new Error('Supabase SDK termuat tanpa fungsi createClient.');
        }
        sb = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
          global: { fetch: xhrFetch }
        });
        supabaseReady = true;
      } catch (error) {
        window.__supabaseSdkError = error instanceof Error ? error : new Error(String(error));
        supabaseReady = false;
        sb = null;
      }
      initApp();
    }

    // Public pages do not depend on Supabase. Render them immediately so a
    // back-navigation from a deck cannot show only the page background while
    // the SDK or a saved member session is being restored.
    (function paintPublicRouteImmediately() {
      const {path}=parseRoute();
      const normalized=normalizePath(path);
      if (path==='/' || path==='') homeView();
      else if (normalized==='/s1/') indexView();
    })();

    bootstrapApp();
  </script>
